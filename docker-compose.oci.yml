services:
  fairway-four:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      FAIRWAY_FOUR_DB_PATH: /data/fairway-four.sqlite
      PORT: "3000"
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - fairway-four
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: